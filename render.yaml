services:
  - type: web
    name: windfinance-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: WINDFINANCE_ENV
        value: prod
      - key: WINDFINANCE_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: windfinance-db
          property: connectionString
      - key: WINDFINANCE_ALLOWED_ORIGINS
        value: https://looqi1.github.io
      - key: PUBLIC_BASE_URL
        value: https://windfinance-api.onrender.com
      - key: WINDFINANCE_SIMULATOR
        value: "1"
      - key: WINDFINANCE_LIVE_TRADING
        value: "0"
      - key: BYBIT_API_BASE_URL
        value: https://api-testnet.bybit.com
      - key: BYBIT_MAX_NOTIONAL_USDT
        value: "100"
      # Реферальный код партнёрской программы Bybit (affiliates.bybit.com)
      - key: BYBIT_REF_CODE
        value: 393YMZP
      - key: FRONTEND_URL
        value: https://looqi1.github.io/Wind-finance/
      # Почта для сброса пароля и ценовых уведомлений (например, Яндекс: smtp.yandex.ru:587).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Telegram-бот для ценовых уведомлений (токен от @BotFather) и секрет вебхука.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # ID администраторов через запятую (видят раздел «Админка» в настройках).
      - key: WINDFINANCE_ADMIN_USER_IDS
        sync: false

databases:
  - name: windfinance-db
    plan: free
