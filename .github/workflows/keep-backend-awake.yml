name: Keep backend awake

# Бесплатный Render усыпляет сервер после 15 минут без запросов, и первый вход длится до минуты.
# Этот workflow раз в 10 минут обращается к /health, пока задана переменная BACKEND_URL.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: curl -fsS --max-time 90 "${BACKEND_URL%/}/health" || echo "::warning::Сервер не ответил"
