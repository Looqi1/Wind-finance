name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt -c constraints.txt
          python -m pytest -q

      - name: Audit locked backend dependencies
        working-directory: backend
        run: |
          python -m venv "$RUNNER_TEMP/wind-pip-audit"
          "$RUNNER_TEMP/wind-pip-audit/bin/pip" install pip-audit==2.10.1
          "$RUNNER_TEMP/wind-pip-audit/bin/pip-audit" -r constraints.txt --disable-pip --no-deps

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.65.2 pytest
          python -m playwright install --with-deps chromium

      - name: Browser tests
        run: python -m pytest -q frontend/tests

  build:
    if: github.event_name != 'pull_request'
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          BYBIT_REF_CODE: ${{ vars.BYBIT_REF_CODE }}
        run: |
          mkdir -p _site
          cp sitefinance/{index.html,converter.html,portfolio.html,sitemap.xml,script.js,style.css} _site/
          cp -R sitefinance/assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          # Каждый деплой получает уникальную версию файлов, чтобы браузер не держал старый кэш.
          VERSION="${GITHUB_SHA::8}"
          sed -i -E "s/(style\.css|script\.js|bybit-spot\.js|wind-finance-hero\.svg)\?v=[0-9A-Za-z]+/\1?v=${VERSION}/g" _site/{index,converter,portfolio}.html
          sed -i -E "s/config\.js\"/config.js?v=${VERSION}\"/" _site/index.html
          printf 'window.WIND_API_URL = %s;\n' \
            "$(python3 -c 'import json, os; print(json.dumps(os.environ.get("BACKEND_URL", "").rstrip("/")))')" \
            > _site/config.js
          if [ -n "$BYBIT_REF_CODE" ]; then
            printf 'window.WIND_BYBIT_REF = %s;\n' \
              "$(python3 -c 'import json, os; print(json.dumps(os.environ["BYBIT_REF_CODE"].strip()))')" \
              >> _site/config.js
          fi
          if [ -z "$BACKEND_URL" ]; then
            python3 -m backend.app.cbr_history _site/assets/market-preview.json || echo "::warning::Не удалось обновить сохранённую историю курсов"
            echo "::warning title=BACKEND_URL не задан::Сайт опубликуется без сервера: вход и регистрация работать не будут. Задай переменную репозитория BACKEND_URL (Settings → Secrets and variables → Actions → Variables)."
          fi
          grep -o '?v=[0-9A-Za-z]*' _site/index.html | sort -u

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
