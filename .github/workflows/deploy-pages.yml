name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          mkdir -p _site
          cp sitefinance/index.html sitefinance/script.js sitefinance/style.css _site/
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          printf 'window.WIND_API_URL = %s;\n' \
            "$(python3 -c 'import json, os; print(json.dumps(os.environ.get("BACKEND_URL", "")))')" \
            > _site/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
