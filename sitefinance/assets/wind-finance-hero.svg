	<path d="M410 624c116-96 170-187 308-236 111-39 177-42 309-128" fill="none" stroke="#baf0d2" stroke-linecap="round" stroke-width="12"/>
	<path d="M515 527 635 462l98 28 110-126 112 18 105-129" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="10" opacity=".9"/>
	<path d="m1018 254 43-6-12 42" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="10"/>
