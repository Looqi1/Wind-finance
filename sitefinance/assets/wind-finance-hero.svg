<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
	<title id="title">Wind Finance</title>
	<desc id="desc">Растущий график, мятная лента ветра и золотая монета с символом рубля</desc>
	<defs>
		<linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="#1f6d52"/>
			<stop offset="1" stop-color="#6fd3a1"/>
		</linearGradient>
		<linearGradient id="ribbon-soft" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
			<stop offset=".45" stop-color="#ffffff" stop-opacity=".5"/>
			<stop offset="1" stop-color="#ffffff" stop-opacity=".2"/>
		</linearGradient>
		<radialGradient id="sun" cx=".4" cy=".35" r=".7">
			<stop offset="0" stop-color="#ffe9a8"/>
			<stop offset="1" stop-color="#f4c95d"/>
		</radialGradient>
		<linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffd978"/>
			<stop offset="1" stop-color="#e6ad35"/>
		</linearGradient>
		<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1f6d52" flood-opacity=".18"/>
		</filter>
	</defs>

	<!-- солнце -->
	<circle cx="500" cy="88" r="58" fill="url(#sun)" opacity=".85"/>
	<circle cx="500" cy="88" r="78" fill="none" stroke="#f4c95d" stroke-opacity=".25" stroke-width="2"/>

	<!-- ленты ветра -->
	<path d="M70 392C150 300 200 236 300 214S440 170 560 70" fill="none" stroke="url(#ribbon-soft)" stroke-linecap="round" stroke-width="54"/>
	<path d="M60 400C140 312 196 250 298 226S446 176 566 84" fill="none" stroke="url(#ribbon)" stroke-linecap="round" stroke-width="20" filter="url(#shadow)"/>
	<path d="M84 400C160 324 212 268 306 246S450 194 566 110" fill="none" stroke="#bff0d6" stroke-opacity=".9" stroke-linecap="round" stroke-width="5"/>

	<!-- график с наконечником, выровненным по последнему отрезку -->
	<path d="M130 330 210 285l70 15 80-80 70 15 90-105" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" opacity=".95"/>
	<path d="M488 142 520 130l-7 33" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
	<g fill="#fff">
		<circle cx="210" cy="285" r="7"/><circle cx="360" cy="220" r="7"/>
	</g>

	<!-- монета с символом рубля -->
	<g filter="url(#shadow)">
		<circle cx="300" cy="118" r="38" fill="url(#coin)"/>
		<circle cx="300" cy="118" r="29" fill="none" stroke="#fff4c7" stroke-width="3"/>
		<path d="M294 98v42M294 98h11a11 11 0 0 1 0 22h-19M286 130h20" fill="none" stroke="#fffbe8" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
	</g>

	<!-- искры -->
	<g fill="#fff" opacity=".75">
		<circle cx="170" cy="150" r="5"/><circle cx="412" cy="300" r="6"/><circle cx="570" cy="230" r="4"/><circle cx="236" cy="70" r="3.5"/>
	</g>
	<path d="M410 52v16M402 60h16" stroke="#fff" stroke-linecap="round" stroke-width="3" opacity=".8"/>
</svg>
