<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
	<title id="title">Wind Finance financial illustration</title>
	<desc id="desc">Flowing mint ribbons and an upward chart with golden coins</desc>
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#e4f8ed"/>
			<stop offset="1" stop-color="#b9e5d0"/>
		</linearGradient>
		<linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="#24785b"/>
			<stop offset="1" stop-color="#77d8a6"/>
